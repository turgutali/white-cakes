name: Notify search engines about changed pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "**/*.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-changed-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Submit changed canonical URLs
        run: python3 scripts/submit_indexnow.py "${{ github.event.before }}" "${{ github.sha }}"
